name: maksabi
description: "مكسبي - نظام تتبع الأرباح - Profit Tracking System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod: ^2.5.1

  # Local Storage
  drift: ^2.22.0
  sqlite3: ^2.7.4
  path_provider: ^2.1.4
  path: ^1.9.0

  # Charts
  fl_chart: ^0.69.0

  # Fonts
  google_fonts: ^6.2.0

  # Export
  csv: ^6.0.0

  # Utilities
  uuid: ^4.5.0
  intl: ^0.20.2
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.22.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  assets:
    - assets/icon/logo.png